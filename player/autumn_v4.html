<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autumn Ablaze</title>
<meta property="og:title" content="Autumn Ablaze">
<meta property="og:description" content="A lone maple blazes crimson and gold above a glass-still alpine lake. As the last light breaks through the peaks, a gust tears a storm of leaves from its crown and scatters them across the water, each one sending out a ring of ripples.">
<meta property="og:image" content="https://cjmjnc.github.io/assets/cards/autumn_v2_poster.jpg">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  video { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; background: #000; }
  @media (max-aspect-ratio: 4/3) { video { object-fit: contain; } }
  .veil { position: fixed; left: 0; right: 0; bottom: 0; padding: 48px 6vw 7vh;
          background: linear-gradient(transparent, rgba(0,0,0,.72)); color: #fff;
          transition: opacity 1.6s ease; pointer-events: none; }
  .veil h1 { margin: 0 0 .35em; font-size: clamp(28px, 5vw, 64px); font-weight: 700; letter-spacing: .02em;
             text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  .veil p { margin: 0; max-width: 46em; font-size: clamp(14px, 1.7vw, 21px); line-height: 1.45; opacity: .92; }
  .faded { opacity: 0; }
  button { position: fixed; top: 18px; right: 18px; z-index: 2; border: 1px solid rgba(255,255,255,.35);
           background: rgba(0,0,0,.45); color: #fff; border-radius: 999px; padding: 10px 18px; font-size: 15px;
           cursor: pointer; backdrop-filter: blur(6px); }
  button:hover { background: rgba(0,0,0,.65); }
</style>
</head>
<body>
<video id="v" autoplay muted loop playsinline preload="auto" poster="../cards/autumn_v2_poster.jpg">
  <source src="../cards/autumn_v2.mp4" type="video/mp4">
</video>
<audio id="amb" src="../cards/autumn_ambience_v4.m4a" loop preload="auto"></audio>
<button id="snd" type="button" aria-label="Turn sound on">&#128266; Tap for sound</button>
<div class="veil" id="veil">
  <h1>Autumn Ablaze</h1>
  <p>A lone maple blazes crimson and gold above a glass-still alpine lake. As the last light breaks through the peaks, a gust tears a storm of leaves from its crown and scatters them across the water, each one sending out a ring of ripples.</p>
</div>
<script>
  const v = document.getElementById('v'), b = document.getElementById('snd'), veil = document.getElementById('veil');
  v.play().catch(() => {});                       // muted autoplay is allowed by every modern browser
  // Sound = CC0 field recording (Freesound 654566) shaped into a 30 s soundtrack: 5 gusts timed to the video's measured leaf-gust, faded in/out.
  const a = document.getElementById('amb'); let on = false, fadeT;
  function fade(to, ms) { clearInterval(fadeT); const from = a.volume, t0 = performance.now();
    fadeT = setInterval(() => { const k = Math.min(1, (performance.now() - t0) / ms); a.volume = from + (to - from) * k;
      if (k >= 1) { clearInterval(fadeT); if (to === 0) a.pause(); } }, 30); }
  b.addEventListener('click', () => {
    on = !on;
    if (on) { a.volume = 0; a.currentTime = v.currentTime; a.play(); fade(0.7, 1500); sync(); b.innerHTML = '&#128263; Mute'; }
    else { fade(0, 800); b.innerHTML = '&#128266; Tap for sound'; }
  });
  // Keep the 30 s soundtrack (5 gusts) locked to the 6 s picture loop: each gust swells as the leaves tear loose and eases as they settle.
  const LOOP = 6.0, CYCLES = 5;
  function sync() {
    if (!on) return;
    const k = Math.round((a.currentTime - v.currentTime) / LOOP);
    const want = (((k % CYCLES) + CYCLES) % CYCLES) * LOOP + v.currentTime;
    const T = LOOP * CYCLES, d = ((a.currentTime - want) % T + T * 1.5) % T - T / 2;   // circular distance, so the 30 s wrap is not a 'drift'
    if (Math.abs(d) > 0.12 && !a.seeking) a.currentTime = want;
    requestAnimationFrame(sync);
  }
  setTimeout(() => veil.classList.add('faded'), 6500);
  document.addEventListener('mousemove', () => { veil.classList.remove('faded'); clearTimeout(window.t);
    window.t = setTimeout(() => veil.classList.add('faded'), 3500); });
</script>
</body>
</html>
